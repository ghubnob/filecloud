spring.application.name=filecloud
server.port=8080
server.servlet.context-path=/
spring.threads.virtual.enabled=true

# file upload properties
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=1000MB
server.tomcat.max-part-count=200
server.tomcat.max-swallow-size=-1

# database (postgre)
spring.datasource.url=jdbc:postgresql://localhost:5433/cloud_file_storage
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# hikari connection pool
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# redis & sessions
spring.session.store-type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
 #spring.session.data.redis.repository-type=default
 #spring.session.data.redis.namespace=cfs:session

# s3 minio config
aws.s3.endpoint=http://localhost:9000
aws.s3.access-key=minioadmin
aws.s3.secret-key=minioadmin
aws.s3.region=us-east-1
aws.s3.bucket-name=user-files

# flyway migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none

# tests & logs
spring.test.context.cache.maxSize=1
spring.output.ansi.enabled=ALWAYS

# debug
#logging.level.org.springframework.web=DEBUG
